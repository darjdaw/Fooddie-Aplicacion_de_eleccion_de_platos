<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Contacto - Fooddie</title>
   <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
  <div class="header-container">
    <a href="index.html" class="logo-link">
      <img src="src/img/fooddie.svg" alt="fooddie" class="logo-img">
    </a>

    <div class="search-container">
      <input type="text" class="search-bar" placeholder="Buscar...">
    </div>

    <nav class="header-nav">
      <ul class="nav-list">
        <li class="nav-item">
          <a href="decidir-comida.html" class="nav-link">Decidir comida</a>
        </li>
        <li class="nav-item">
          <a href="organizar-pedido.html" class="nav-link">Organizar pedido</a>
        </li>
        <li class="nav-item">
          <a href="mis-colecciones.html" class="nav-link">Mis colecciones</a>
        </li>
      </ul>
    </nav>

    <div class="header-spacer"></div>

    <div class="action-icons">
      <button type="button" class="icon-btn">
        <img src="src/img/icon-share.svg" alt="Compartir" class="nav-icon">
      </button>
      <button type="button" class="icon-btn">
        <img src="src/img/icon-history.svg" alt="Historial" class="nav-icon">
      </button>
      <button type="button" class="icon-btn">
        <img src="src/img/icon-notifications.svg" alt="Avisos" class="nav-icon">
      </button>
      <button type="button" class="icon-btn">
        <img src="src/img/icon-darkmode.svg" alt="Modo nocturno" class="nav-icon">
      </button>
    </div>

    <div class="user-block">
      <span class="welcome-text">Bienvenido, usuario/a</span>
      <button type="button" class="burger-btn">
        <img src="src/img/burger.svg" alt="Menú" class="nav-icon">
      </button>
      <img src="src/img/profile-avatar.jpg" alt="Foto de perfil" class="profile-img">
    </div>
  </div>
</header>

<main class="main-content">

   <h1>Contacto</h1>

   <form id="form-contacto" novalidate>

   <div class="campo">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre"
             required maxlength="50" autocomplete="name"
             aria-describedby="error-nombre">
      <span id="error-nombre" class="error-mensaje"></span>
   </div>

   <div class="campo">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email"
             required maxlength="100" autocomplete="email"
             aria-describedby="error-email">
      <span id="error-email" class="error-mensaje"></span>
   </div>

   <div class="campo">
      <label for="motivo">Motivo</label>
      <select id="motivo" name="motivo" required
              aria-describedby="error-motivo">
         <option value="">Elige un motivo</option>
         <option value="error-precio-info">Reportar error en precio o info</option>
         <option value="incidencia-reparto">Incidencia con un reparto de gastos</option>
         <option value="otro">Otro</option>
      </select>
      <span id="error-motivo" class="error-mensaje"></span>
   </div>

   <div class="campo">
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="6"
                required minlength="10" maxlength="500"
                aria-describedby="contador-mensaje error-mensaje"></textarea>
      <p id="contador-mensaje" class="contador"></p>
      <span id="error-mensaje" class="error-mensaje"></span>
   </div>

   <button type="submit">Enviar mensaje</button>

</form>
</main>

<footer class="footer">
  <div class="footer-container">
    <p class="cookie-policy">Política de cookies</p>
    <p class="copyright">© 2026 Cádiz</p>
  </div>
</footer>

<script type="module" src="js/contacto.js"></script>

</body>
</html>
