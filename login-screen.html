<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Iniciar Sesión - Fooddie</title>
   <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

  <main class="login-container">
    <div class="login-card">
      
      <div class="login-form-side">
        <h1 class="login-title">BIENVENIDO<br>A FOODDIE</h1>
        <p class="login-subtitle">Lorem ipsum dolor sit amet consectetur. Nulla morbi id quam vel magna elementum.</p>

        <form action="index.html" class="form-group">
          <div class="input-wrapper">
            <span class="input-icon"></span>
            <input type="text" class="login-input" placeholder="">
          </div>

          <div class="input-wrapper">
            <span class="input-icon"></span>
            <input type="password" class="login-input" placeholder="">
          </div>

          <span class="error-message">Usuario o contraseña incorrectos</span>

          <button type="submit" class="btn-acceder">ACCEDER</button>
        </form>

        <div class="login-social-boxes">
          <div class="social-box red"></div>
          <div class="social-box blue"></div>
          <div class="social-box orange"></div>
        </div>

        <p class="register-text">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
      </div>

      <div class="login-badge-side">
        <div class="decorative-badge"></div>
      </div>

    </div>
  </main>
  
  <footer class="footer login-footer">
    <div class="footer-container">
      <a href="#" class="cookie-policy">Política de cookies</a>
      <p class="copyright">© 2026 Cádiz</p>
    </div>
  </footer>

</body>
</html>
