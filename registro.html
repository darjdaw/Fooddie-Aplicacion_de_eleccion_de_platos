<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <title>Crear cuenta - Fooddie</title>
   <link rel="stylesheet" href="css/style.css">
</head>

<body class="registro-page">
   <main class="registro-container">
      <section class="registro-card" aria-labelledby="titulo-formulario">
         <div class="registro-form-side">
            <h1 class="registro-title" id="titulo-formulario">CREA TU CUENTA</h1>
            <p class="registro-subtitle">
               Únete a Fooddie y guarda tus platos favoritos, comparte ideas y decide qué comer.
            </p>

            <form id="form-registro" class="registro-form" novalidate>
               <div class="registro-campo">
                  <label for="usuario">Nombre de usuario</label>
                  <div class="registro-input-wrap">
                     <span class="registro-icon icon-user" aria-hidden="true"></span>
                     <input class="registro-input" type="text" id="usuario" name="usuario"
                            required maxlength="20" autocomplete="username"
                            placeholder="¿Cómo te llamamos?" aria-describedby="error-usuario">
                  </div>
                  <span id="error-usuario" class="error-mensaje" aria-live="polite"></span>
               </div>

               <div class="registro-campo">
                  <label for="email">Correo electrónico</label>
                  <div class="registro-input-wrap">
                     <span class="registro-icon icon-email" aria-hidden="true"></span>
                     <input class="registro-input" type="email" id="email" name="email"
                            required maxlength="100" autocomplete="email"
                            placeholder="nombre@correo.com" aria-describedby="error-email">
                  </div>
                  <span id="error-email" class="error-mensaje" aria-live="polite"></span>
               </div>

               <div class="registro-campo">
                  <label for="password">Contraseña</label>
                  <div class="registro-input-wrap">
                     <span class="registro-icon icon-lock" aria-hidden="true"></span>
                     <input class="registro-input" type="password" id="password" name="password"
                            required autocomplete="new-password" placeholder="Crea una contraseña"
                            aria-describedby="error-password">
                  </div>
                  <span id="error-password" class="error-mensaje" aria-live="polite"></span>
               </div>

               <div class="registro-campo">
                  <label for="repetir-password">Repetir contraseña</label>
                  <div class="registro-input-wrap">
                     <span class="registro-icon icon-repeat" aria-hidden="true"></span>
                     <input class="registro-input" type="password" id="repetir-password" name="repetir-password"
                            required autocomplete="new-password" placeholder="Escríbela otra vez"
                            aria-describedby="error-repetir-password">
                  </div>
                  <span id="error-repetir-password" class="error-mensaje" aria-live="polite"></span>
               </div>

               <div class="registro-campo registro-campo-wide">
                  <label for="fecha-nacimiento">Fecha de nacimiento</label>
                  <div class="registro-input-wrap">
                     <span class="registro-icon icon-calendar" aria-hidden="true"></span>
                     <input class="registro-input registro-date" type="date" id="fecha-nacimiento" name="fecha-nacimiento"
                            required min="1900-01-01" autocomplete="bday"
                            aria-describedby="error-fecha-nacimiento">
                  </div>
                  <span id="error-fecha-nacimiento" class="error-mensaje" aria-live="polite"></span>
               </div>

               <div class="registro-campo registro-campo-wide registro-conditions">
                  <div class="registro-checkbox-row">
                     <input type="checkbox" id="condiciones" name="condiciones" required
                            aria-describedby="error-condiciones">
                     <label for="condiciones">Acepto las condiciones de uso</label>
                  </div>
                  <span id="error-condiciones" class="error-mensaje" aria-live="polite"></span>
               </div>

               <button type="submit" id="btn-guardar" class="btn-registro">CREAR CUENTA</button>
               <p id="estado-formulario" class="registro-status" role="status" aria-live="polite"></p>
            </form>

            <p class="registro-login-link">¿Ya tienes cuenta? <a href="login-screen.html">Inicia sesión</a></p>
            <div class="registro-color-blocks" aria-hidden="true">
               <span class="color-block color-red"></span>
               <span class="color-block color-cyan"></span>
               <span class="color-block color-orange"></span>
            </div>
         </div>
         </div>
      </section>
   </main>

  <footer class="footer">
    <div class="footer-container">
      <p class="cookie-policy">Política de cookies</p>
      <p class="copyright">© 2026 Cádiz</p>
    </div>
  </footer>

  <script type="module" src="js/registro.js"></script>
  <script src="js/menu.js" defer></script>
  
</body>
</html>
