<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Registro - Fooddie</title>
   <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
  <div class="header-container">
    <a href="index.html" class="logo-link">
      <img src="src/img/fooddie.svg" alt="fooddie" class="logo-img">
    </a>

    <div class="search-container">
      <input type="text" class="search-bar" placeholder="Buscar...">
    </div>

    <nav class="header-nav">
      <ul class="nav-list">
        <li class="nav-item">
          <a href="decidir-comida.html" class="nav-link">Decidir comida</a>
        </li>
        <li class="nav-item">
          <a href="organizar-pedido.html" class="nav-link">Organizar pedido</a>
        </li>
        <li class="nav-item">
          <a href="mis-colecciones.html" class="nav-link">Mis colecciones</a>
        </li>
      </ul>
    </nav>

    <div class="header-spacer"></div>

    <div class="action-icons">
      <button type="button" class="icon-btn">
        <img src="src/img/icon-share.svg" alt="Compartir" class="nav-icon">
      </button>
      <button type="button" class="icon-btn">
        <img src="src/img/icon-history.svg" alt="Historial" class="nav-icon">
      </button>
      <button type="button" class="icon-btn">
        <img src="src/img/icon-notifications.svg" alt="Avisos" class="nav-icon">
      </button>
      <button type="button" class="icon-btn">
        <img src="src/img/icon-darkmode.svg" alt="Modo nocturno" class="nav-icon">
      </button>
    </div>

    <div class="user-block">
      <span class="welcome-text">Bienvenido, usuario/a</span>
      <button type="button" class="burger-btn">
        <img src="src/img/burger.svg" alt="Menú" class="nav-icon">
      </button>
      <img src="src/img/profile-avatar.jpg" alt="Foto de perfil" class="profile-img">
    </div>
  </div>
</header>

<main class="main-content">

   <h1 id="titulo-formulario">Crear cuenta</h1>

   <form id="form-registro" novalidate>

      <div class="campo">
         <label for="usuario">Nombre de usuario</label>
         <input type="text" id="usuario" name="usuario"
                required maxlength="20" autocomplete="username">
      </div>

      <div class="campo">
         <label for="email">Correo electrónico</label>
         <input type="email" id="email" name="email"
                required maxlength="100" autocomplete="email">
      </div>

      <div class="campo">
         <label for="password">Contraseña</label>
         <input type="password" id="password" name="password"
                required autocomplete="new-password">
      </div>

      <div class="campo">
         <label for="repetir-password">Repetir contraseña</label>
         <input type="password" id="repetir-password" name="repetir-password"
                required autocomplete="new-password">
      </div>

      <div class="campo">
         <label for="fecha-nacimiento">Fecha de nacimiento</label>
         <input type="date" id="fecha-nacimiento" name="fecha-nacimiento"
                required min="1900-01-01">
      </div>

      <div class="campo campo-casilla">
         <input type="checkbox" id="condiciones" name="condiciones" required>
         <label for="condiciones">Acepto las condiciones de uso</label>
      </div>

      <button type="submit" id="btn-guardar">Registrarme</button>

   </form>
</main>

<footer class="footer">
  <div class="footer-container">
    <p class="cookie-policy">Política de cookies</p>
    <p class="copyright">© 2026 Cádiz</p>
  </div>
</footer>

<script type="module" src="js/registro.js"></script>

</body>
</html>
